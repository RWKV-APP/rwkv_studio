name: Build

on:
  push:
    branches:
      - ci
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build (${{ matrix.platform }})
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal
            optional: true

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "value=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            ninja-build \
            libblkid-dev \
            liblzma-dev \
            unzip

      - name: Fetch RWKV native libs
        shell: bash
        run: |
          chmod +x fetch_rwkv_libs.sh
          ./fetch_rwkv_libs.sh ${{ matrix.platform }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: flutter build macos --release

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Archive (macOS)
        if: matrix.platform == 'macos'
        run: |
          ARCHIVE="rwkv-studio-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.zip"
          cd build/macos/Build/Products/Release
          zip -r "${{ github.workspace }}/$ARCHIVE" "RWKV Studio.app"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Archive (Linux)
        if: matrix.platform == 'linux'
        run: |
          ARCHIVE="rwkv-studio-${{ steps.version.outputs.value }}-linux-${{ matrix.arch }}.tar.gz"
          tar -czf "$ARCHIVE" -C build/linux/x64/release/bundle .
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Archive (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = "rwkv-studio-${{ steps.version.outputs.value }}-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rwkv-studio-${{ steps.version.outputs.value }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7
