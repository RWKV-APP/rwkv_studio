name: Build

on:
  push:
    branches:
      - ci
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            ninja-build \
            libblkid-dev \
            liblzma-dev \
            wget \
            unzip

      - name: Fetch RWKV native libs (macOS / Linux)
        if: matrix.platform != 'windows'
        run: |
          chmod +x fetch_rwkv_libs.sh
          ./fetch_rwkv_libs.sh

      - name: Fetch RWKV native libs (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp\windows | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/dengzii/rwkv_libs/releases/download/latest/librwkv_mobile-dev-latest-windows-x64.zip" `
            -OutFile "tmp\win.zip"
          Expand-Archive -Path "tmp\win.zip" -DestinationPath "tmp\windows" -Force
          if (Test-Path "tmp\windows\Release") {
            Copy-Item -Recurse -Force "tmp\windows\Release\*" "windows\"
          } else {
            Copy-Item -Recurse -Force "tmp\windows\*" "windows\"
          }
          Remove-Item -Recurse -Force tmp

      - name: Get dependencies
        run: flutter pub get

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: flutter build macos --release --no-codesign

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: flutter build linux --release

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: flutter build windows --release

      - name: Upload artifact (macOS)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: rwkv-studio-macos
          path: build/macos/Build/Products/Release/
          retention-days: 7

      - name: Upload artifact (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: rwkv-studio-linux
          path: build/linux/x64/release/bundle/
          retention-days: 7

      - name: Upload artifact (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: rwkv-studio-windows
          path: build/windows/x64/runner/Release/
          retention-days: 7
