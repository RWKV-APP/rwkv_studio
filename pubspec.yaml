name: rwkv_studio
description: "RWKV Studio"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.1+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  rwkv_dart:
    path: ../rwkv_dart
#    git:
#      url: https://github.com/RWKV-APP/rwkv_dart.git
#      ref: dev

  rwkv_downloader:
    path: ../rwkv_downloader
#    git:
#      url: https://github.com/RWKV-APP/rwkv_downloader.git
#      ref: dev
  rwkv_libs:
    path: ../rwkv_libs

  flutter_bloc: ^9.1.1
  dio: ^5.9.2
  rxdart: ^0.28.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  flutter_svg: ^2.2.4
  window_manager: ^0.5.1
  fluent_ui: ^4.15.0
  flutter_acrylic: ^1.1.4
  gpt_markdown: ^1.1.5
  vyuh_node_flow: ^0.27.3

  file_selector: ^1.1.0
  path_provider: ^2.1.5
  just_audio: ^0.10.5
  just_audio_windows:
  just_audio_media_kit:
  media_kit_libs_windows_audio:
  url_launcher: ^6.3.2
  desktop_drop: ^0.7.0
  crypto: ^3.0.7
  logging: ^1.3.0
  archive: ^4.0.9

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.13.0
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansSC
      fonts:
        - asset: fonts/NotoSansSC-VariableFont_wght.ttf

  assets:
    - assets/rwkv/
    - assets/img/
